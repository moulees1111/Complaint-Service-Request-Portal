spring.application.name=ComplaintPortal

spring.datasource.url=jdbc:mysql://localhost:3306/complaint_portal
spring.datasource.username=root
spring.datasource.password=GSMg1122@@

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080



# Actuator configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Application information
management.info.env.enabled=true
info.app.name=Complaint Management Portal
info.app.description=Complaint and Service Request Management System
info.app.version=1.0.0


# HikariCP connection pool
spring.datasource.hikari.pool-name=ComplaintPortalPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000